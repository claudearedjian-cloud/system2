<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>system2 · Cabinet Manufacturing OPS</title>
  <link rel="stylesheet" href="/css/app.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f766e'/%3E%3Cpath d='M9 8h14v16H9z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="fatalBanner" hidden></div>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◧</span>
      <div class="brand-text">
        <h1>system<span>2</span></h1>
        <p>Polyboard → bSolid · Biesse Rover A</p>
      </div>
    </div>

    <div class="project-picker">
      <label for="projectSelect">Project</label>
      <select id="projectSelect"></select>
    </div>

    <div class="stats" id="statsBar"></div>

    <div class="topbar-actions">
      <button class="btn" id="btnImportFolder" title="Import a Polyboard export folder">📁 Import folder</button>
      <button class="btn ghost" id="btnLoadSample" title="Load the bundled demo kitchen">▶ Load sample</button>
      <button class="btn ghost" id="btnSettings" title="Workshop configuration">⚙ Settings</button>
    </div>
  </header>

  <div class="layout">
    <!-- Left: import + project tree -->
    <aside class="sidebar">
      <section class="import-zone">
        <div class="dropzone" id="dropzone">
          <div class="dz-icon">⇩</div>
          <p><strong>Drop a Polyboard export</strong></p>
          <p class="muted">cutting-list .txt · assembly .csv · part .dxf</p>
          <input type="file" id="fileInput" multiple accept=".txt,.csv,.dxf" />
          <input type="file" id="folderInput" webkitdirectory multiple />
          <label class="btn small" for="folderInput">Choose folder</label>
        </div>
        <div class="import-status" id="importStatus"></div>
      </section>

      <section class="tree-section">
        <div class="section-head">
          <h2>Project tree</h2>
          <span id="treeCount" class="chip"></span>
        </div>
        <div class="tree" id="tree"></div>
      </section>
    </aside>

    <!-- Main -->
    <main class="main">
      <nav class="tabs" id="tabs">
        <button data-tab="viewer" class="active">2D / 3D Viewer</button>
        <button data-tab="validation">Pre-flight</button>
        <button data-tab="cix">CIX · Compile</button>
        <button data-tab="bom">BOM &amp; Labels</button>
        <button data-tab="settings">Settings</button>
      </nav>

      <section class="tab-panel" id="panel-viewer">
        <div class="viewer-toolbar">
          <div class="seg" id="viewModeSeg">
            <button data-mode="2d" class="active">2D panel</button>
            <button data-mode="3d">3D assembly</button>
          </div>
          <div class="viewer-actions">
            <label class="check"><input type="checkbox" id="chkShowDrills" checked /> drillings</label>
            <label class="check"><input type="checkbox" id="chkShowGrooves" checked /> toolpaths</label>
            <label class="check"><input type="checkbox" id="chkShowBand" checked /> edge banding</label>
            <button class="btn small ghost" id="btnFit">⌖ fit</button>
          </div>
        </div>
        <div class="viewer-host">
          <div id="viewer2d" class="viewer"></div>
          <div id="viewer3d" class="viewer hidden"></div>
          <div id="viewerEmpty" class="empty-hint">Import or load a project to begin.</div>
        </div>
      </section>

      <section class="tab-panel hidden" id="panel-validation"></section>
      <section class="tab-panel hidden" id="panel-cix"></section>
      <section class="tab-panel hidden" id="panel-bom"></section>
      <section class="tab-panel hidden" id="panel-settings"></section>
    </main>

    <!-- Right: inspector -->
    <aside class="inspector" id="inspector">
      <div class="section-head"><h2>Panel</h2></div>
      <div id="inspectorBody" class="empty-hint">Select a panel in the tree.</div>
    </aside>
  </div>

  <footer class="statusbar" id="statusbar">Ready.</footer>

  <script>
    // Fail-safe diagnostics — plain script, runs even if the module below
    // never loads (caching, old browser, or a network error on a vendor file).
    (function () {
      var b = document.getElementById('fatalBanner');
      var status = document.getElementById('statusbar');
      function show(msg) {
        if (b) { b.hidden = false; b.innerHTML = msg; }
      }
      window.addEventListener('error', function (e) {
        if (e && e.message) show('⚠ Script error: ' + e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('⚠ Error: ' + (r && r.message ? r.message : String(r)));
      });

      // Is this browser new enough for the app at all? (checks optional
      // chaining + nullish coalescing, which the app code relies on)
      try {
        var probe = new Function('var o = null; return o && o.x ? 1 : (o?.x ?? 7);');
        if (probe() !== 7) throw new Error('syntax');
      } catch (err) {
        show('⚠ Your browser is too old for this app. Update Chrome or Edge, then reload this page.');
        if (status) status.innerHTML = 'Browser too old.';
        return;
      }

      // Verify the vendor files actually served (catches missing public/vendor).
      var assets = ['/vendor/three.module.js'];
      var pending = assets.length;
      assets.forEach(function (u) {
        fetch(u).then(function (r) {
          if (!r.ok) {
            show('⚠ Missing asset <b>' + u + '</b> (HTTP ' + r.status + '). Run <b>npm install</b> to regenerate public/vendor.');
          }
        }).catch(function () {
          show('⚠ Could not load <b>' + u + '</b>. Run <b>npm install</b> to regenerate public/vendor.');
        }).finally(function () {
          pending -= 1;
        });
      });

      // If the app never reports ready, surface the browser info to copy here.
      setTimeout(function () {
        if (window.__appReady) return;
        var ua = navigator.userAgent || 'unknown';
        show('⚠ The app did not finish loading.<br>' +
             'Browser: <b>' + ua + '</b><br>' +
             '1) Press <b>Ctrl+Shift+R</b> to force-refresh.<br>' +
             '2) If it still fails, press <b>F12</b> → <b>Console</b> and copy the red lines here.');
      }, 3500);
    })();
  </script>
  <script type="module" src="/js/app.js?v=3"></script>
</body>
</html>
